name: Conectar Telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Obtener identificador del chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          if not token:
              raise SystemExit('Falta guardar TELEGRAM_BOT_TOKEN en los secretos.')
          try:
              with urllib.request.urlopen(
                  'https://api.telegram.org/bot' + token + '/getUpdates', timeout=30
              ) as response:
                  data = json.load(response)
          except Exception:
              raise SystemExit('No se pudo consultar Telegram. Comprueba el token guardado.') from None
          try:
              with urllib.request.urlopen('https://api.telegram.org/bot' + token + '/getMe', timeout=30) as response:
                  bot = json.load(response).get('result', {})
              username = bot.get('username', 'desconocido')
              print('Bot asociado al token: @' + username)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Bot asociado al token: @' + username + '\n\n')
          except Exception:
              raise SystemExit('No se pudo identificar el bot.') from None
          chats = {}
          for update in data.get('result', []):
              message = update.get('message', {})
              chat = message.get('chat', {})
              if chat.get('type') == 'private' and message.get('text', '').strip().split('@')[0] == '/start':
                  chats[chat['id']] = True
          if len(chats) != 1:
              raise SystemExit('Chats privados con /start encontrados: ' + str(len(chats)) + '. Comprueba el usuario del bot indicado arriba y envíale /start nuevamente.')
          chat_id = next(iter(chats))
          print('TELEGRAM_CHAT_ID = ' + str(chat_id))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Identificador de Telegram\n\nGuarda un secreto llamado TELEGRAM_CHAT_ID con este valor:\n\n' + str(chat_id) + '\n')
          PY
